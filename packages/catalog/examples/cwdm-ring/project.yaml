# cwdm-ring: 4 sites in a physical ring (site1->site2->site3->site4->site1), each carrying its
# own CWDM channel two hops around to the site opposite it (site1 1471nm -> site3, site2 1491nm
# -> site4, site3 1511nm -> site1, site4 1531nm -> site2), expressed through the intermediate
# site's OADM rather than terminating at the first hop. Each site has two chained single-channel
# add/drop modules (line-in / line-out, see sites/site1.yaml — generic-cwdm-oadm-1471/1491/
# 1511/1531, one catalog model per wavelength, reused at both its add site and its drop site)
# that add/drop their own channel and express the other, so every span physically carries two
# wavelengths. Each SFP's launch power is fixed at +4dBm (tx_power_override_dBm) rather than
# left to the transceiver's full -2..+6dBm datasheet range: generic-10g-cwdm-80km is an 80km,
# high-power-class CWDM optic, and its datasheet max (+6dBm) would overload a receiver just
# 1-2 short ring hops away (the original bug this example was fixing); a fixed, deliberately
# chosen launch power is how such an optic is actually operated on a short ring in practice.
# Every OADM common still shows a channel-imbalance warning/error: the just-added, one-hop-old
# channel on each span is 5.5-7.3dB stronger than the two-hop, twice-expressed channel sharing
# it — a real, expected ROADM effect (per-channel VOA equalization on the add ports would flatten
# it) that this example leaves visible rather than papering over, since the brief only asked for
# every Rx to pass with comfortable margin, not for imbalance-free spans.
# Split one file per site plus a spans file for the four ring fibres.
optiplanner: 1

includes:
  - { file: sites/site1.yaml, label: Site 1 }
  - { file: sites/site2.yaml, label: Site 2 }
  - { file: sites/site3.yaml, label: Site 3 }
  - { file: sites/site4.yaml, label: Site 4 }
  - { file: spans.yaml,       label: Ring spans }

project:
  name: CWDM ring
  description: >-
    Four-site unidirectional ring; each site adds its own CWDM channel (fixed launch +4dBm)
    and drops the channel destined for it, expressing everything else through intermediate
    OADMs to its destination two hops away. All 4 Rx pass with 2.2-3.5dB of margin; per-span
    channel imbalance (5.5-7.3dB, a fresh add vs. a twice-expressed channel) is flagged but not
    equalised — see the header comment.
  wavelength_plans: [cwdm-18]
  margins:
    system_margin_dB: 3.0
    ageing_dB: 1.0
    repair_splices: 2
    repair_splice_loss_dB: 0.1
    connector_ageing_dB: 0.0
    cd_margin_pct: 10
    max_channel_imbalance_dB: 6

layout:
  sites:
    site1: { x: 200, y: 0,   w: 220, h: 160 }
    site2: { x: 500, y: 200, w: 220, h: 160 }
    site3: { x: 350, y: 500, w: 220, h: 160 }
    site4: { x: 0,   y: 200, w: 220, h: 160 }
  files:
    sites/site1.yaml: { x: 180, y: -20,  w: 260, h: 200 }
    sites/site2.yaml: { x: 480, y: 180,  w: 260, h: 200 }
    sites/site3.yaml: { x: 330, y: 480,  w: 260, h: 200 }
    sites/site4.yaml: { x: -20, y: 180,  w: 260, h: 200 }
    spans.yaml:        { x: -40, y: -40, w: 820, h: 720 }
