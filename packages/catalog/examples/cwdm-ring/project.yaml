# cwdm-ring: 4 sites in a physical ring (site1->site2->site3->site4->site1), each carrying its
# own CWDM channel two hops around to the site opposite it (site1 1471nm -> site3, site2 1491nm
# -> site4, site3 1511nm -> site1, site4 1531nm -> site2), expressed through the intermediate
# site's OADM rather than terminating at the first hop. Each site has two chained
# generic-cwdm-oadm-8ch OADMs (line-in / line-out, see sites/site1.yaml) that add/drop their
# own two channels and express the rest, so every span physically carries two wavelengths.
# Split one file per site plus a spans file for the four ring fibres.
optiplanner: 1

includes:
  - { file: sites/site1.yaml, label: Site 1 }
  - { file: sites/site2.yaml, label: Site 2 }
  - { file: sites/site3.yaml, label: Site 3 }
  - { file: sites/site4.yaml, label: Site 4 }
  - { file: spans.yaml,       label: Ring spans }

project:
  name: CWDM ring
  description: >-
    Four-site unidirectional ring; each site adds its own CWDM channel and drops the channel
    destined for it, expressing everything else through intermediate OADMs to its destination
    two hops away.
  wavelength_plans: [cwdm-18]
  margins:
    system_margin_dB: 3.0
    ageing_dB: 1.0
    repair_splices: 2
    repair_splice_loss_dB: 0.1
    connector_ageing_dB: 0.0
    cd_margin_pct: 10
    max_channel_imbalance_dB: 6

layout:
  sites:
    site1: { x: 200, y: 0,   w: 220, h: 160 }
    site2: { x: 500, y: 200, w: 220, h: 160 }
    site3: { x: 350, y: 500, w: 220, h: 160 }
    site4: { x: 0,   y: 200, w: 220, h: 160 }
  files:
    sites/site1.yaml: { x: 180, y: -20,  w: 260, h: 200 }
    sites/site2.yaml: { x: 480, y: 180,  w: 260, h: 200 }
    sites/site3.yaml: { x: 330, y: 480,  w: 260, h: 200 }
    sites/site4.yaml: { x: -20, y: 180,  w: 260, h: 200 }
    spans.yaml:        { x: -40, y: -40, w: 820, h: 720 }
