# FS.com 1G CWDM / DWDM SFP optics. Format and conventions: README.md in this directory.
# Primary source: FS "1G/2.5G SFP Cable and Transceiver Modules Data Sheet" (2023-11 edition,
# https://resource.fs.com/mall/doc/20231115172041cpq6rr.pdf), Table 3 "Optical specifications"
# (p.16). The 2023-01 and 2022 editions carry identical figures for the parts they list.
# Single-product datasheets were used for the 20km/40km/120km CWDM parts (not in the combined
# sheet), for receiver wavelength ranges, and as cross-checks; each such use is stated in `notes`.
#
# FS prints the same P/N for several reaches (CWDM-SFP1G-ZX = 20/40/80km, CWDM-SFP1G-EZX =
# 100/120km). The unsuffixed pn is the reach the combined datasheet lists it at; other reaches get
# a " (NNkm)" suffix so pn stays unique.

# ---------------------------------------------------------------- CWDM
- pn: CWDM-SFP1G-ZX (20km)
  id: fs-cwdm-sfp1g-zx-20km
  fs_products: [ 52770 ]
  title: 1000BASE-CWDM SFP, 1270-1610nm, 20km, SMF
  form_factor: SFP
  rate_Gbps: 1
  reach_km: 20
  media: smf
  connector: lc-upc
  temp: commercial
  channels:
    plan: cwdm-18
    ids: [ "1271", "1291", "1311", "1331", "1351", "1371", "1391", "1411", "1431", "1451", "1471", "1491", "1511", "1531", "1551", "1571", "1591", "1611" ]
    tunable: false
  tx_power_dBm: { min: -5, max: 0 }
  rx_sensitivity_dBm: -24
  rx_overload_dBm: -8
  rx_range_nm: [ 1260, 1620 ]
  source: "https://img-en.fs.com/file/datasheet/cwdm-sfp1g-zx-20km.pdf (sec. V Optical Characteristics, p.4)"
  verified: true
  notes: "Not in the combined 1G datasheet. The single-product datasheet prints P/N CWDM-SFP1G-ZX (same as the 80km part); its ordering table lists the 20/40/80km variants under that one P/N. Total system budget 19 dB per datasheet."

