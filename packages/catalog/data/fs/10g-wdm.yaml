# FS.com 10G CWDM / DWDM (fixed and tunable) SFP+ optics. Format and conventions: README.md in this directory.
# Primary source: FS "10G SFP+ Cable and Transceiver Modules Data Sheet" (2025-04-07 edition),
# Table 3 "Optical specifications" (pp.17-18). The 2025-04-03 and 2022 editions carry identical
# Table 3 figures. For DWDM, the current single-product datasheets (FS renamed DWDM-SFP10G-40/80
# to DW-SFP10G40-xx / DW-SFP10G80-xx) are used where they exist; single-product datasheets also
# give receiver ranges and CD tolerance. Each such use is stated in `notes`.

# ---------------------------------------------------------------- CWDM
