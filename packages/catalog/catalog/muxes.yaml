    Generic single-channel CWDM add/drop module (thin-film-filter), 1491nm, with an express
    path. See generic-cwdm-oadm-1471.
  plan: cwdm-18
  channel_ports: ["1491"]
  insertion_loss_dB: { min: 1.0, typ: 1.5, max: 2.5 }
  express_port: { insertion_loss_dB: { typ: 1.0, max: 1.5 } }
  isolation_dB: 25
