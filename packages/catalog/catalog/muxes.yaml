# Mux / demux / OADM. SPEC.md §5.4. A mux is direction-agnostic: `common` <-> channel ports.
# `channel_ports: all` generates one port per channel of `plan`; an explicit list (e.g. for an
# OADM) generates only those. insertion_loss_dB is the default channel-port <-> common loss;
# express_port (if present) carries channels not dropped locally.

- kind: mux
  id: generic-cwdm-8ch
  description: Generic 8-channel CWDM mux/demux, thin-film-filter, channels 1471-1611nm
  plan: cwdm-18
  channel_ports: ["1471", "1491", "1511", "1531", "1551", "1571", "1591", "1611"]
  insertion_loss_dB: { min: 1.5, typ: 2.0, max: 3.0 }
  isolation_dB: 25
  connector: lc-upc
  source: "typical value (unverified) — representative thin-film-filter CWDM 8ch mux datasheet range"

- kind: mux
  id: generic-cwdm-18ch
  description: Generic 18-channel CWDM mux/demux (full grid), thin-film-filter cascade
  plan: cwdm-18
  channel_ports: all
  insertion_loss_dB: { min: 2.5, typ: 3.5, max: 4.5 }
  isolation_dB: 25
  connector: lc-upc
  source: "typical value (unverified) — representative thin-film-filter CWDM 18ch mux datasheet range (higher IL than 8ch due to more cascaded filter stages)"

- kind: mux
  id: generic-cwdm-oadm-1471
  description: >-
    Generic single-channel CWDM add/drop module (thin-film-filter), 1471nm, with an express
    path — the cwdm-ring example chains a pair of these (plus the 1511nm pair) per site so the
    channel not dropped locally continues around the ring through the express port. A
    single-channel add/drop module only ever needs one named channel_port, which also keeps
    the engine from matching a same-named channel port on an instance where it was never
    wired (SPEC.md §5.4: a channel port routes by matching wavelength, not by wiring).
  plan: cwdm-18
  channel_ports: ["1471"]
  insertion_loss_dB: { min: 1.0, typ: 1.5, max: 2.5 }
  express_port: { insertion_loss_dB: { typ: 1.0, max: 1.5 } }
  isolation_dB: 25
  connector: lc-upc
  source: "typical value (unverified) — representative thin-film-filter single-channel CWDM add/drop module datasheet range; express_port IL same class as generic-dwdm-oadm-4ch"

