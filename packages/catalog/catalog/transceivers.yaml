- kind: transceiver
  id: generic-100g-lr4
  description: >-
    Generic 100GBASE-LR4 QSFP28, 4-lane LAN-WDM CWDM4 grid, 10km. The catalog schema's
    tx.wavelength holds a single value; the four LAN-WDM lane wavelengths are recorded under
    x.lanes_nm for reference (see README "schema limitations").
  form_factor: QSFP28
  rate_Gbps: 100
  reach_km: 10
  tx:
    wavelength: { wavelength_nm: 1300 }
    power_dBm: { min: -4.3, typ: 0, max: 4.5 }
  rx:
    sensitivity_dBm: -10.6
    overload_dBm: 4.5
    wavelength_range_nm: [1294.53, 1310.19]
  ports:
    tx: { direction: out, connector: lc-upc }
    rx: { direction: in, connector: lc-upc }
  x:
    lanes_nm: [1295.56, 1300.05, 1304.58, 1309.14]
  source: "IEEE 802.3ba-2010 clause 88 (100GBASE-LR4) optical parameter table"

