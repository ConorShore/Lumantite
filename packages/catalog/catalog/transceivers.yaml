- kind: transceiver
  id: example-10g-dwdm-t18
  description: >-
    Example tunable DWDM SFP+ sized to reproduce SPEC.md test T18 exactly (Rx sensitivity
    -14dBm, overload -1dBm, CD tolerance +-1600ps/nm) — used by the dwdm-amplified example
    instead of generic-10g-dwdm-80km, whose -7dBm overload is too low for T18's post-amplifier
    per-channel powers (up to ~+0.8dBm at the demux input).
  form_factor: SFP+
  rate_Gbps: 10
  reach_km: 80
  tx:
    wavelength: { plan: dwdm-c-100ghz-40, channels: all }
    power_dBm: { min: -6, typ: 0, max: 3 }   # instance channels use tx_power_override_dBm (+3/0/-3/-6)
  rx:
    sensitivity_dBm: -14
    overload_dBm: -1
    cd_tolerance_ps_nm: { min: -1600, max: 1600 }
    wavelength_range_nm: [1528, 1568]
  ports:
    tx: { direction: out, connector: lc-upc }
    rx: { direction: in, connector: lc-upc }
  source: "SPEC T18 test values"

