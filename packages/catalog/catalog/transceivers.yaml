  source: "Cisco DWDM-SFP10G-C datasheet class values (launch power -1..+4dBm, CD tolerance 1600 ps/nm, 80km @ ~20 ps/nm/km); see cisco-dwdm-sfp10g-c for the cited vendor figures"

