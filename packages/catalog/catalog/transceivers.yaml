# Transceivers. SPEC.md §5.1. Generic base models carry IEEE/MSA-typical grey or WDM optics;
# vendor models `extends` a generic base and override with datasheet values plus a `source` URL.
# Where an exact datasheet number could not be confirmed, `source` says "typical value (unverified)".

# ============================== generic grey optics ==============================

- kind: transceiver
  id: generic-1g-lx
  description: Generic 1000BASE-LX SFP, 1310nm, 10km
  form_factor: SFP
  rate_Gbps: 1.25
  reach_km: 10
  tx:
    wavelength: { wavelength_nm: 1310 }
    power_dBm: { min: -9.5, typ: -3, max: -3 }
  rx:
    sensitivity_dBm: -20
    overload_dBm: -3
    wavelength_range_nm: [1270, 1355]
  ports:
    tx: { direction: out, connector: lc-upc }
    rx: { direction: in, connector: lc-upc }
  source: "IEEE 802.3-2018 clause 38 (1000BASE-LX) optical parameter table"

