# =========================================== Finisar ===========================================
# Both part numbers below are real Finisar (now Coherent Corp) SFP+ numbers. Despite the '1471'
# and '1671' in the names — which look like CWDM wavelengths — datasheets confirm these are
# grey 10GBASE-LR/ER optics (D3BCL = duplex LC, 3.3V, cooled), not CWDM parts. See README.

- kind: transceiver
  id: finisar-ftlx1471d3bcl
  extends: generic-10g-lr
  vendor: Finisar (Coherent Corp)
  model: FTLX1471D3BCL
  description: >-
    10GBASE-LR/LW SFP+, 1310nm, 10km. NOT a 1471nm CWDM optic despite the part number —
    confirmed by datasheet (wavelength range 1260-1360nm, 6dB link budget, IEEE 802.3ae).
  source: "https://www.mouser.com/datasheet/2/1457/Coherent_FTLX1471D3BCL-3581310.pdf (confirms 10GBASE-LR/LW 1310nm 10km; exact Tx/Rx power table not extracted, IEEE 802.3ae typical values used)"

- kind: transceiver
  id: finisar-ftlx1671d3bcl
  extends: generic-10g-er
  vendor: Finisar (Coherent Corp)
  model: FTLX1671D3BCL
  description: >-
    10GBASE-ER/EW SFP+, 1550nm, 40km. NOT a 1671nm CWDM optic despite the part number —
    confirmed by datasheet.
  tx:
    wavelength: { wavelength_nm: 1550 }
    power_dBm: { min: -3, typ: 0, max: 3 }
  rx:
    sensitivity_dBm: -14.1
    overload_dBm: -1.0
    wavelength_range_nm: [1530, 1565]
  source: "https://www.mouser.com/ds/2/610/FTLX1671D3BCL%20Product%20Spec%20RevC_1-275074.pdf (TX -3..+3dBm, RX -14.1..-1.0dBm, 1550nm 40km, confirmed)"
